# Production-like local stack on Apache Kafka (KRaft mode, no ZooKeeper).
#
#   python -m src.train_model             # once: produces models/fraud_model.joblib
#   docker compose up -d --build
#   open http://localhost:8501  (dashboard)   http://localhost:8000/docs  (API)
#
# All services share the `lake` volume: the consumer is the only writer.
x-app: &app
  build: .
  environment: &env
    BROKER_BACKEND: kafka
    KAFKA_BOOTSTRAP: kafka:9092
    FRAUD_DATA_DIR: /app/data
    API_URL: http://api:8000
  volumes:
    - lake:/app/data
  restart: unless-stopped

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: fraud-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 4
      KAFKA_LOG_RETENTION_HOURS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12

  consumer:
    <<: *app
    command: ["python", "-m", "src.consumer"]
    depends_on: { kafka: { condition: service_healthy } }

  producer:
    <<: *app
    command: ["python", "-m", "src.simulator", "run", "--hours", "6", "--tps", "25"]
    depends_on: { consumer: { condition: service_started } }

  graph:                                   # fraud-ring snapshots every 2 min (reads the lake)
    <<: *app
    command: ["python", "-m", "src.graph", "--watch", "120"]
    depends_on: [consumer]

  monitor:                                 # drift + champion/challenger report every 5 min
    <<: *app
    command: ["python", "-m", "src.monitoring", "--watch", "300"]
    depends_on: [consumer]

  api:
    <<: *app
    command: ["uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports: ["8000:8000"]
    environment:
      <<: *env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}     # optional: Claude copilot (offline analyst without it)
    depends_on: [consumer]

  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    ports: ["8501:8501"]
    environment:
      <<: *env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on: [consumer]

volumes:
  lake:
